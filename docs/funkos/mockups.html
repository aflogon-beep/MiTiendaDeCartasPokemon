<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tienda de Funkos · mockups</title>
<!-- Mockups de diseño (docs/funkos/DISENO.md). No es código del juego: sirve para ver las pantallas antes de hacerlas. -->
<style>
:root{--bg:#1b1f2a;--panel:#252b3a;--panel2:#2f3648;--ink:#eef1f7;--mu:#98a3b8;--up:#4cc98a;--down:#ff7a6b;--line:#39415a;--fd:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;--fk:#ff4fd8}
*{box-sizing:border-box}
body{margin:0;background:#0e1118;color:var(--ink);font-family:system-ui,sans-serif;width:390px}
.scr{background:var(--bg);padding:14px 14px 18px;border-bottom:6px solid #000;position:relative}
.cap{font:700 11px var(--fd);color:#0e1118;background:#ffd54a;display:inline-block;padding:2px 8px;border-radius:6px;margin-bottom:6px}
h2{font-family:var(--fd);margin:4px 0 10px;font-size:24px}
h3{font-family:var(--fd);margin:14px 0 8px;font-size:17px}
.mu{color:var(--mu);font-size:12.5px}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
.tip{background:var(--panel2);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13.5px}
.b{border:0;border-radius:12px;padding:11px 6px;font-family:var(--fd);font-weight:700;font-size:14.5px;color:#fff;background:var(--panel2);box-shadow:0 3px 0 #0005;text-align:center;display:block}
.b.pri{background:linear-gradient(#53d48f,#2fa564);box-shadow:0 3px 0 #1d7a47}
.b.fk{background:linear-gradient(#ff7ae3,#d23cb6);box-shadow:0 3px 0 #8a1f76}
.b small{display:block;font-weight:500;font-size:11px;opacity:.85}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.hero{display:flex;gap:10px;align-items:center;border-radius:16px;padding:10px 12px;font-size:13.5px;color:#2a1830;background:linear-gradient(135deg,#ffe3f1,#ffd0e6)}
.hero.sun{background:linear-gradient(135deg,#fff3c4,#ffe08a);color:#3a2a00}
.hero.sky{background:linear-gradient(135deg,#d9f0ff,#b8e0ff);color:#0b2a44}
.hero .av{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:26px;flex:none}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.chip{font:700 11px var(--fd);border-radius:20px;padding:3px 8px;background:var(--panel2)}
.chip.ch{background:linear-gradient(90deg,#c9a227,#ffe27a);color:#3a2a00}
.chip.ex{background:#2a5bd0}
.chip.va{background:#5a2a2a;color:#ffc9c9}
.chip.ok{background:#1f6f43;color:#c9ffd9}
.tabs{display:flex;gap:6px;overflow:hidden;margin:10px 0}
.tabs b{background:var(--panel2);border-radius:10px;padding:8px 11px;font:600 12.5px var(--fd);white-space:nowrap}
.tabs b.on{background:var(--fk);color:#2a0028}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qty{background:var(--panel2);border-radius:12px;padding:6px 10px;text-align:center;min-width:60px}
.qty b{font-family:var(--fd);font-size:21px;display:block;line-height:1}
.qty i{font-style:normal;font-size:10.5px;color:var(--mu)}
.up{color:var(--up)}.down{color:var(--down)}
/* Caja de Funko */
.box{position:relative;width:96px;height:128px;border-radius:7px;background:var(--fc);box-shadow:inset -9px 0 0 #0002,0 6px 14px #0007;padding:20px 6px 6px;overflow:hidden;flex:none}
.box .top{position:absolute;left:0;right:0;top:0;height:18px;background:#111;color:#fff;font:800 9.5px/18px var(--fd);text-align:center;letter-spacing:.05em}
.box .win{height:84px;border-radius:7px;background:radial-gradient(circle at 50% 35%,#fff 0%,#e7ecf5 60%,#cbd3e2 100%);box-shadow:inset 0 0 0 2px #ffffffaa,inset 0 0 18px #0003;position:relative;overflow:hidden}
.box .win:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#ffffff99 45%,transparent 55%)}
.box .win svg{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:80px}
.box .lb{margin-top:3px;color:#fff;font:700 10.5px/1.1 var(--fd);text-shadow:0 1px 0 #0006;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box .num{position:absolute;right:4px;top:21px;background:#111;color:#fff;font:800 9.5px var(--fd);padding:1px 4px;border-radius:4px;z-index:2}
.box.dmg{transform:rotate(-2deg)}
.box.dmg:before{content:"";position:absolute;right:-6px;top:-6px;width:30px;height:30px;background:#0e1118;transform:rotate(45deg);z-index:3}
.stk{position:absolute;left:-4px;bottom:20px;z-index:3;transform:rotate(-12deg);background:radial-gradient(circle,#fff6c4,#e2b12c);color:#3a2a00;font:900 8.5px/1 var(--fd);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;text-align:center;box-shadow:0 2px 4px #0006}
.stk.ex{background:radial-gradient(circle,#dbe6ff,#3f6fe0);color:#fff}
.stk.gl{background:radial-gradient(circle,#d9ffe2,#34c26b);color:#05341a}
.fkc{display:grid;grid-template-columns:96px 1fr;gap:12px;position:relative;overflow:hidden}
.fkc:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,var(--fc) 0%,transparent 55%);opacity:.2;pointer-events:none}
.fkc b.n{font-family:var(--fd);font-size:17px;display:block}
.step{display:flex;align-items:center;gap:6px;margin-top:6px}
.step span{width:28px;height:28px;border-radius:9px;background:var(--panel2);display:grid;place-items:center;font-weight:800}
.step b{font-family:var(--fd);font-size:17px;min-width:60px;text-align:center}
/* calle */
.street{position:relative;height:230px;border-radius:16px;overflow:hidden;background:linear-gradient(#8fd0ff,#cfeaff 55%,#9aa3ad 55%,#8b939c 72%,#5d636b 72%)}
.bld{position:absolute;bottom:28%;border-radius:6px 6px 0 0}
.bld .sign{position:absolute;left:8%;right:8%;top:8px;height:22px;border-radius:5px;font:800 11px/22px var(--fd);text-align:center}
.bld .wn{position:absolute;left:12%;right:12%;bottom:0;height:52%;background:linear-gradient(#bfe7ff,#7cb6dd);border:4px solid #3a3f4a;border-bottom:0}
.sale{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-6deg);background:#fff;color:#c0392b;border:3px solid #c0392b;font:900 12px var(--fd);padding:4px 7px;border-radius:6px;white-space:nowrap}
.pin{position:absolute;font:700 11px var(--fd);background:#111c;color:#fff;padding:2px 6px;border-radius:8px}
/* interior */
.shop{position:relative;height:470px;border-radius:16px;overflow:hidden}
.wall{position:absolute;left:0;right:0;top:0;height:118px;background:linear-gradient(#3a2a58,#2a1f3d)}
.floor{position:absolute;left:0;right:0;top:118px;bottom:0;background:repeating-linear-gradient(45deg,#efe2fb 0 18px,#e6d4f6 18px 36px)}
.neon{position:absolute;left:50%;top:6px;transform:translateX(-50%);font:900 20px var(--fd);color:#ffd1ff;text-shadow:0 0 6px #ff4fd8,0 0 16px #ff4fd8,0 0 30px #b44fff;letter-spacing:.04em;white-space:nowrap}
.wsh{position:absolute;top:72px;height:40px;display:flex;gap:2px;align-items:end;padding:0 5px;border-bottom:6px solid #8a5a2b}
.mini{width:18px;height:28px;border-radius:3px;position:relative}
.mini:after{content:"";position:absolute;inset:6px 3px 4px;background:#fff9;border-radius:2px}
.tag{position:absolute;font:800 9.5px var(--fd);background:#111;color:#fff;padding:1px 5px;border-radius:5px}
.isl{position:absolute;width:110px;height:52px;border-radius:10px;background:#b07a46;box-shadow:0 6px 0 #7a4e26;display:flex;gap:4px;justify-content:center;padding-top:8px}
.grail{position:absolute;right:16px;top:200px;width:96px;height:132px;border-radius:10px;background:linear-gradient(#ffffff55,#ffffff22);border:3px solid #ffd54a;box-shadow:0 0 18px #ffd54a88}
.grail svg{width:76px;position:absolute;left:8px;top:14px}
.cnt{position:absolute;left:18px;bottom:62px;width:150px;height:44px;border-radius:10px;background:#5a3a8a;box-shadow:0 6px 0 #3a2460;color:#fff;font:700 11px/44px var(--fd);text-align:center}
.ppl{position:absolute;font-size:24px}
.hud{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px}
.hud .b{flex:1;padding:8px 4px;font-size:13px}
.sw{position:absolute;right:10px;top:128px;display:flex;flex-direction:column;gap:6px}
.sw b{background:#111d;color:#fff;border-radius:12px;padding:6px 10px;font:700 12px var(--fd)}
.sw b.on{background:var(--fk);color:#2a0028}
/* figuras */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fg{background:var(--panel2);border-radius:12px;padding:4px 2px 6px;text-align:center;font:600 10.5px/1.15 var(--fd);position:relative}
.fg svg{width:70px;height:84px;display:block;margin:0 auto}
.fg i{display:block;font-style:normal;color:var(--mu);font-size:9.5px}
.fg.miss svg{filter:brightness(0) opacity(.3)}
.fg.ch{background:linear-gradient(#5a4512,#2f3648)}
.bar{height:10px;border-radius:6px;background:var(--panel2);overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff7ae3,#9b6bff)}
.ticket{background:#fffdf5;color:#222;border-radius:10px;padding:12px 14px;font:12.5px ui-monospace,monospace;box-shadow:0 8px 20px #0008}
.ticket h4{margin:0 0 6px;text-align:center;font:800 15px var(--fd)}
.tl{display:flex;justify-content:space-between;gap:8px}
.tl.t{border-top:1px dashed #999;margin-top:6px;padding-top:6px;font-weight:800}
.inp{background:#fff;color:#111;border-radius:12px;padding:12px;font:700 18px var(--fd);text-align:center;margin:8px 0}
.sug{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.sug span{background:var(--panel2);border-radius:20px;padding:5px 10px;font:600 12px var(--fd)}
.cand{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center}
.cand .av{width:52px;height:52px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:30px}
.stars{color:#ffd54a;letter-spacing:1px}
.big{display:flex;justify-content:center;padding:10px 0 16px}
.big .box{transform:scale(1.8);transform-origin:top center;margin-bottom:104px}
.reveal{text-align:center;background:radial-gradient(circle at 50% 40%,#3b3214,#14161f 70%);border-radius:18px;padding:16px 10px;position:relative;overflow:hidden}
.reveal:before{content:"";position:absolute;left:50%;top:48%;width:340px;height:340px;transform:translate(-50%,-50%);background:repeating-conic-gradient(#ffd54a33 0 8deg,transparent 8deg 22deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%)}
.reveal h4{font-family:var(--fd);font-size:23px;margin:2px 0 8px;color:#ffe27a;text-shadow:0 0 18px #ffcf3a;position:relative}
.val{font-family:var(--fd);font-size:28px;font-weight:700;position:relative}
.spark{width:84px;height:26px}
.queue{display:flex;gap:2px;font-size:22px;justify-content:center;margin:6px 0}
.conv{background:linear-gradient(135deg,#1d2b6b,#5a1f6b);border-radius:16px;padding:14px;text-align:center}
.conv h3{margin:2px 0;color:#fff}
.timer{font:800 26px var(--fd);color:#ffd54a}
</style>
</head>
<body>
<script src="figuras.js"></script>
<script src="zona.js"></script>
<script>
const W = (h) => document.write(h);
const fig = (n) => FIG.find((x) => x[0] === n)[2];
// Caja de Funko: figura, número, nombre, color de la colección y pegatina (chase, exclusiva, brilla)
function box(n, num, col, st, cls) {
  const S = { chase: '<div class="stk">CHASE</div>', ex: '<div class="stk ex">EXCLU-<br>SIVA</div>', gl: '<div class="stk gl">BRILLA<br>OSCURO</div>' }[st] || "";
  return `<div class="box ${cls || ""}" style="--fc:${col}"><div class="top">POP! VINILO</div><div class="num">#${num}</div><div class="win">${F(fig(n))}</div><div class="lb">${n}</div>${S}</div>`;
}
const spark = (up) => `<svg class="spark" viewBox="0 0 84 26"><polyline fill="none" stroke="${up ? "#4cc98a" : "#ff7a6b"}" stroke-width="2" points="${up ? "0,22 12,20 24,21 36,16 48,17 60,11 72,8 84,4" : "0,6 12,8 24,7 36,12 48,11 60,16 72,18 84,21"}"/></svg>`;
const scr = (n, t, h) => W(`<div class="scr" id="m${n}"><div class="cap">${n} · ${t}</div>${h}</div>`);

// 1 · La calle: la librería de al lado se traspasa
scr(1, "La librería de al lado se traspasa", `<div style="position:relative;height:230px;border-radius:16px;overflow:hidden;background:url(tienda.jpg) -190px -420px / 560px auto"><div class="sale" style="left:62%;top:48%">SE TRASPASA</div><div class="pin" style="left:4%;top:6%">⬅ Tu tienda</div><div class="pin" style="right:4%;top:6%">La librería ➡</div></div>
<div class="pn"><h3 style="margin-top:0">📚 Se traspasa: la librería de al lado</h3><p style="margin:0 0 8px">Don Ramón, el librero, se jubila. Su local está <b>pegado a tu tienda</b>, al lado de la caja: si lo compras, abrimos un paso en la pared y tu tienda crece con una <b>zona solo de Funkos</b>.</p>
<div class="tip">🧸 Funkos de Marvel, DC, Star Wars, Harry Potter, anime, videojuegos, Disney… y Pokémon</div>
<div class="tip">🏪 Es tu misma tienda: misma caja, mismos clientes, mismo personal</div>
<div class="tip">🛸 Mobiliario friki: estatua de Vader, Halcón Milenario colgado, máquina de gancho…</div>
<div class="tip">⭐ La zona tiene su propio nivel: al subirlo desbloqueas las figuras más chetadas</div>
<span class="b pri" style="margin-top:8px">Comprar el local · 15.000 €<small>Necesitas nivel 5</small></span></div>`);

// 2 · Nombre de la zona
scr(2, "Al comprarlo: le pones nombre", `<div class="hero sun"><div class="av">👴</div><div><b>Don Ramón:</b> Cuarenta años vendiendo libros aquí… Me alegra que sean figuras de esas cabezonas. ¡Cuidádmelo!</div></div>
<h2 style="margin-top:14px">¿Cómo se llama vuestra zona Funko?</h2>
<div class="inp">Zona Funko</div>
<div class="sug"><span>Zona Funko</span><span>Pop Galaxy</span><span>Cabezones</span><span>El Rincón Friki</span><span>✏️ Escribe el tuyo</span></div>
<div class="hero" style="margin-top:14px"><div class="av">🤩</div><div><b>Álvaro:</b> ¡¡Una zona entera de Funkos!! ¿Ponemos un Vader de verdad en la puerta?</div></div>
<div class="hero sky" style="margin-top:8px"><div class="av">😎</div><div><b>Emma:</b> Yo me pido el sofá de la zona Funko. Desde ahí, con el mando, lo controlo todo… y las cuentas de la tienda las sigo llevando yo.</div></div>
<span class="b pri" style="margin-top:12px">¡Abrimos! 🎉</span>`);

// 3 · La tienda ampliada (captura real del juego + zona dibujada encima)
scr(3, "Tu tienda con la zona Funko", `<div style="position:relative;width:362px;height:513px;border-radius:14px;overflow:hidden;background:url(tienda.jpg) 0 0 / 362px 513px"><div id="zov" style="position:absolute"></div></div>
<p class="mu">Captura real de la tienda con la ampliación de la panadería. La zona Funko (dibujada encima) ocupa el local de la librería, a la derecha de la caja. Se entra por un paso junto a la caja y también por su puerta de la calle.</p>`);

// 4 · La zona de cerca
scr(4, "La zona Funko de cerca", `<div id="zbig" style="border-radius:14px;overflow:hidden"></div><ol class="mu" style="padding-left:18px;margin:8px 0 0">${ZONA_LEYENDA.map((t) => `<li>${t}</li>`).join("")}</ol>`);

// 5 · Mobiliario friki
const MOB = [
  ["🗿", "Estatua de Darth Vader (tamaño real)", "Los fans de Star Wars compran un 15 % más", "1.200 €", 1],
  ["🛸", "Halcón Milenario colgado del techo", "+8 % clientes en la zona", "900 €", 1],
  ["🕹️", "Máquina de gancho con Funkos", "Los niños juegan: 1 € la partida (a veces se llevan un Funko)", "700 €", 2],
  ["👾", "Máquina recreativa", "+20 % de paciencia en la cola", "650 €", 2],
  ["🦾", "Armadura de Iron Man en su cápsula", "Los fans de Marvel aceptan precios un 6 % más altos", "1.500 €", 4],
  ["🌑", "Alfombra de la Estrella de la Muerte", "+6 % clientes en la zona", "400 €", 1],
  ["🏰", "Estandartes de Hogwarts", "Los fans de Harry Potter compran un 15 % más", "500 €", 3],
  ["⚡", "Pikachu gigante de 1 metro", "+10 % clientes niños", "800 €", 2],
  ["🛋️", "Sofá gamer con tele y consola (el de Emma)", "Viene con el local · Emma da un consejo al día", "incluido", 1],
  ["🔭", "Vitrinas de cristal con LED", "+8 huecos de exposición", "1.100 €", 1],
  ["💎", "Cámara de los grails", "Las piezas de vitrina valen un 10 % más", "2.500 €", 5],
  ["🌀", "Portal de las estrellas (el paso)", "Viene con el local", "incluido", 1],
];
scr(5, "Mejoras: mobiliario friki", `<h2>🛸 Mejoras · Zona Funko</h2><div class="hero sky"><div class="av">🤓</div><div><b>Papá:</b> Una tienda friki sin un Halcón Milenario colgado del techo es solo… una tienda.</div></div>
${MOB.map(([ic, n, d, c, lv]) => `<div class="pn row" style="margin:8px 0"><div style="display:flex;gap:10px;align-items:center"><div style="width:42px;height:42px;border-radius:12px;background:#3a2a58;display:grid;place-items:center;font-size:22px;flex:none">${ic}</div><div><b style="font-size:14px">${n}</b><div class="mu">${d}</div></div></div>${c === "incluido" ? '<span class="chip ok">Incluido</span>' : lv > 3 ? `<span class="chip va" style="white-space:nowrap">🔒 Nivel ${lv}</span>` : `<span class="b pri" style="padding:8px 10px;font-size:13px;white-space:nowrap">${c}</span>`}</div>`).join("")}`);

// 6 · Nivel de la zona Funko
const NIV = [
  [1, "Pokémon · Videojuegos · Disney", "comunes", 1],
  [2, "Marvel · Star Wars · Stranger Things", "comunes y raras", 1],
  [3, "Harry Potter · DC · Anime", "+ brillan en la oscuridad", 1],
  [4, "Series y películas · Terror", "+ metálicas y flocked", 0],
  [5, "Eventos con exclusivas", "uno cada semana", 0],
  [6, "Deluxe: escenas y figuras de 25 cm", "Halcón con Han, Trono de Hierro…", 0],
  [7, "Chase más a menudo", "1 de cada 4 cajas", 0],
  [8, "Diamond Collection", "purpurina, muy buscadas", 0],
  [9, "Grails legendarios", "edición de 480 unidades", 0],
  [10, "Funko de oro de 24 quilates", "el Santo Grial (una sola pieza)", 0],
];
scr(6, "Nivel de la zona Funko", `<h2>⭐ Zona Funko · Nivel 3</h2>
<div class="row"><span class="mu">Sube vendiendo Funkos, completando el álbum y con encargos</span><b>1.240 / 2.000 ⭐</b></div><div class="bar"><i style="width:62%"></i></div>
${NIV.map(([l, n, d, ok]) => `<div class="pn row" style="margin:7px 0;${ok ? "" : "opacity:.75"}"><div style="display:flex;gap:10px;align-items:center"><div style="width:36px;height:36px;border-radius:50%;background:${ok ? "var(--fk)" : "var(--panel2)"};color:${ok ? "#2a0028" : "#fff"};display:grid;place-items:center;font:800 15px var(--fd);flex:none">${l}</div><div><b style="font-size:14px">${n}</b><div class="mu">${d}</div></div></div>${ok ? '<span class="chip ok">✔</span>' : "<span>🔒</span>"}</div>`).join("")}`);

// 7 · Encargado de Funkos
scr(7, "Personal: encargado de la zona Funko", `<h2>👔 Personal</h2>
<div class="pn cand"><div class="av">🧑‍💼</div><div><b>Cajero/a</b><div class="mu">Cobra a los clientes de toda la tienda.</div></div><span class="chip ok">Contratado · 20 €/día</span></div>
<div class="pn cand" style="border-color:var(--fk)"><div class="av">🧑‍🎤</div><div><b>Encargado de la zona Funko</b><div class="mu">Repone las estanterías de Funkos desde el almacén, vuelve a pedir lo que se acaba (con el tope de gasto que elijas) y compra figuras a los clientes que vienen a vender, sin preguntarte.</div><div class="mu" style="margin-top:4px">Tope de pedidos: <b style="color:#fff">150 €/día</b> · ✏️</div></div><span class="b pri" style="padding:8px">45 €<small>/día</small></span></div>
<div class="tip">Sin encargado, lo haces tú: las estanterías de Funkos se vacían y hay que reponerlas desde Stock.</div>`);

// 6 · Stock de Funkos
scr(8, "Stock de Funkos", `<h2>📦 Stock · Funkos</h2>
<div class="hero"><div class="av">🤩</div><div><b>Álvaro:</b> ¡Ha salido la <b>ola 3 de Star Wars</b>! Si pillamos la Chase de Grogu…</div></div>
<div class="tabs"><b class="on">Star Wars</b><b>Marvel</b><b>DC</b><b>Harry Potter</b><b>Anime</b></div>
